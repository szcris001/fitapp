
# Docker Compose para producción (VPS / servidor propio).
# Si usas Railway, Render o Vercel, NO necesitas este archivo —
# esas plataformas gestionan sus propios contenedores.
#
# Uso:
#   cp .env.production.example .env.production
#   # editar .env.production con valores reales
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   (--env-file es necesario: las ${VARIABLES} de este archivo salen de .env.production)
#
# Dominios — editar nginx/nginx.conf antes de levantar.

services:
  # ─── Base de datos ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fithub_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No exponer puerto al exterior en producción.
    # Si necesitas conectarte para debug: docker exec -it fithub_db_prod psql -U $DB_USER $DB_NAME
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fithub_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API (Fastify) ──────────────────────────────────────────────────────────
  api:
    build:
      # Contexto = raíz del monorepo (workspace + lockfile)
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fithub_api_prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      # La API usa fitapp_app (sin superusuario, sujeto a RLS); el admin solo migra
      DATABASE_URL: postgresql://fitapp_app:${APP_DB_PASSWORD}@postgres:5432/${DB_NAME}
      DATABASE_ADMIN_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      # Uploads persistentes (comprobantes, avatares)
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      # node:alpine no trae curl; wget viene en busybox
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next la incrusta en el bundle del navegador en tiempo de build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: fithub_web_prod
    restart: unless-stopped
    # Sin env_file: la web solo usa NEXT_PUBLIC_API_URL (build arg) y no debe
    # recibir secretos del backend (DB, JWT, pasarelas)
    environment:
      NODE_ENV: production
    depends_on:
      - api
    expose:
      - "3000"

  # ─── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: fithub_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

  # ─── Certbot (Let's Encrypt) ─────────────────────────────────────────────────
  # Solo necesario si gestionas SSL en este VPS.
  # Primer certificado:
  #   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
  #     --webroot --webroot-path=/var/www/certbot \
  #     -d api.dominio.com -d app.dominio.com \
  #     --email tu@email.com --agree-tos --no-eff-email
  # Renovación automática (añadir al cron del host):
  #   0 3 * * * docker compose -f docker-compose.prod.yml run --rm certbot renew --quiet
  certbot:
    image: certbot/certbot:latest
    container_name: fithub_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certbot_www:
  certbot_conf:
