# Nginx reverse proxy para FitHub
# Reemplaza "dominio.com" con tu dominio real en todos los bloques.
# SSL gestionado por Certbot (Let's Encrypt) — ver docker-compose.prod.yml.

# Redirigir todo HTTP a HTTPS
server {
    listen 80;
    server_name api.dominio.com app.dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API — api.dominio.com → Fastify en puerto 3001
server {
    listen 443 ssl;
    server_name api.dominio.com;

    ssl_certificate /etc/letsencrypt/live/api.dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Subida de archivos (comprobantes de pago, avatares)
    client_max_body_size 10M;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Web — app.dominio.com → Next.js en puerto 3000
server {
    listen 443 ssl;
    server_name app.dominio.com;

    ssl_certificate /etc/letsencrypt/live/app.dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
