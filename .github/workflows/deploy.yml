name: Deploy to Production

on:
  push:
    branches: [master]

# Solo un deploy a la vez
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─── Deploy API ───────────────────────────────────────────────────────────────
  #
  # environment: production configura la aprobación manual en GitHub.
  # Ve a: Settings > Environments > production > Required reviewers
  # y agrega tu usuario antes de usar este workflow.
  #
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Opción A: Railway ─────────────────────────────────────────────────────
      # Instalar CLI: npm i -g @railway/cli
      # Agregar RAILWAY_TOKEN a GitHub Secrets.
      # Descomentar:
      #
      # - name: Deploy to Railway
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #   run: railway up --service api --detach

      # ── Opción B: Render ──────────────────────────────────────────────────────
      # Agregar RENDER_DEPLOY_HOOK_API a GitHub Secrets (URL del deploy hook de Render).
      # Descomentar:
      #
      # - name: Deploy to Render
      #   run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      # ── Opción C: VPS con Docker Compose ─────────────────────────────────────
      # Agregar SSH_HOST, SSH_USER, SSH_KEY a GitHub Secrets.
      # Descomentar:
      #
      # - name: Deploy to VPS via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_KEY }}
      #     script: |
      #       cd /opt/fithub
      #       git pull origin master
      #       docker compose -f docker-compose.prod.yml up -d --build api

      - name: Deploy API (placeholder)
        run: |
          echo "Deploy API to production"
          echo "Commit: ${{ github.sha }}"
          echo "---"
          echo "Descomentar la opcion de deploy correspondiente en este archivo."
          echo "Opciones disponibles: Railway, Render, VPS con Docker Compose."

  # ─── Deploy Web ───────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ── Opción A: Vercel (recomendado para Next.js) ───────────────────────────
      # Agregar VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID a GitHub Secrets.
      # Descomentar:
      #
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: --prod

      # ── Opción B: VPS con Docker Compose ─────────────────────────────────────
      # Descomentar y adaptar igual que en deploy-api.

      - name: Deploy Web (placeholder)
        run: |
          echo "Deploy Web to production"
          echo "Commit: ${{ github.sha }}"
          echo "---"
          echo "Descomentar la opcion de deploy correspondiente en este archivo."
          echo "Opciones disponibles: Vercel, VPS con Docker Compose."
