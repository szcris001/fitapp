services:
  postgres:
    image: postgres:16-alpine
    container_name: fitapp_db
    environment:
      POSTGRES_USER: fitapp
      POSTGRES_PASSWORD: fitapp123
      POSTGRES_DB: fitapp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitapp_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
